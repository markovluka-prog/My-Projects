<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Простые числа — диаграммы</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1a1a2e;
    color: #eee;
    font-family: 'Arial', sans-serif;
    padding: 30px 20px;
  }
  h1 {
    text-align: center;
    font-size: 2em;
    margin-bottom: 8px;
    color: #fff;
    letter-spacing: 2px;
  }
  .subtitle {
    text-align: center;
    color: #aaa;
    margin-bottom: 40px;
    font-size: 0.95em;
  }
  .grid {
    display: flex;
    flex-wrap: wrap;
    gap: 30px;
    justify-content: center;
  }
  .card {
    background: #16213e;
    border-radius: 16px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    min-width: 240px;
  }
  .card-title {
    font-size: 1.1em;
    font-weight: bold;
    margin-bottom: 4px;
    color: #fff;
  }
  .card-sub {
    font-size: 0.75em;
    color: #888;
    margin-bottom: 14px;
  }
  canvas { display: block; }
  .legend {
    margin-top: 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
    max-width: 220px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 0.72em;
    color: #ccc;
  }
  .legend-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
</style>
</head>
<body>

<h1>Простые числа</h1>
<p class="subtitle">Сумма разниц между первым и последним простым числом в каждой сотне</p>

<div class="grid" id="grid"></div>

<script>
const DATA = {"0": [95, 98, 82, 90, 98, 96, 90, 96, 78, 90], "1000": [88, 90, 96, 98, 90, 86, 98, 80, 88, 98], "2000": [96, 68, 94, 90, 66, 90, 90, 90, 96, 96], "3000": [88, 82, 96, 90, 92, 82, 90, 96, 86, 82], "4000": [98, 66, 96, 70, 84, 90, 88, 96, 88, 96], "5000": [96, 96, 88, 96, 76, 90, 70, 90, 96, 84], "6000": [84, 98, 96, 96, 70, 78, 84, 92, 96, 90], "7000": [78, 90, 90, 86, 88, 84, 96, 90, 66, 92], "8000": [84, 90, 88, 78, 48, 98, 90, 76, 90, 76], "9000": [90, 96, 90, 86, 94, 76, 96, 72, 84, 72]};

// Цветовая палитра по значению
function valueColor(val, allVals) {
  const max = Math.max(...allVals);
  const min = Math.min(...allVals);
  const norm = (val - min) / (max - min || 1);

  // Градиент: красный (высокое) → жёлтый → зелёный (низкое)
  // Как в твоей презентации
  const palettes = [
    [239, 83, 80],   // красный — высокие
    [255, 167, 38],  // оранжевый
    [255, 213, 79],  // жёлтый
    [102, 187, 106], // зелёный — низкие
  ];

  const idx = norm * (palettes.length - 1);
  const lo = Math.floor(idx);
  const hi = Math.min(lo + 1, palettes.length - 1);
  const t = idx - lo;
  const c = palettes[lo].map((v, i) => Math.round(v + t * (palettes[hi][i] - v)));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}

// Найти группы с одинаковыми значениями
function findGroups(vals) {
  const groups = {};
  vals.forEach((v, i) => {
    if (!groups[v]) groups[v] = [];
    groups[v].push(i);
  });
  return Object.entries(groups)
    .filter(([,g]) => g.length > 1)
    .map(([v, g]) => ({ val: +v, indices: g }));
}

function drawWheel(canvas, vals, size) {
  const ctx = canvas.getContext('2d');
  canvas.width = size;
  canvas.height = size;
  const cx = size / 2, cy = size / 2;
  const R = size / 2 - 8;
  const r = R * 0.38; // внутренний радиус
  const n = vals.length;
  const step = (2 * Math.PI) / n;
  const start = -Math.PI / 2; // начать сверху

  const groups = findGroups(vals);
  // Индексы которые в группе
  const inGroup = new Set();
  groups.forEach(g => g.indices.forEach(i => inGroup.add(i)));

  vals.forEach((val, i) => {
    const a1 = start + i * step;
    const a2 = a1 + step - 0.03;

    // Заливка сектора
    ctx.beginPath();
    ctx.moveTo(cx + r * Math.cos(a1 + 0.015), cy + r * Math.sin(a1 + 0.015));
    ctx.arc(cx, cy, R, a1 + 0.015, a2);
    ctx.arc(cx, cy, r, a2, a1 + 0.015, true);
    ctx.closePath();

    ctx.fillStyle = valueColor(val, vals);
    ctx.fill();

    // Обводка для одинаковых
    if (inGroup.has(i)) {
      ctx.strokeStyle = 'rgba(255,255,255,0.85)';
      ctx.lineWidth = 2.5;
      ctx.stroke();
    }

    // Текст значения
    const mid = a1 + step / 2;
    const tr = (R + r) / 2;
    const tx = cx + tr * Math.cos(mid);
    const ty = cy + tr * Math.sin(mid);

    ctx.font = `bold ${size < 200 ? 10 : 13}px Arial`;
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(val, tx + 0.7, ty + 0.7);
    ctx.fillStyle = '#fff';
    ctx.fillText(val, tx, ty);

    // Метка сотни (0xx, 1xx...) — снаружи
    const lr = R + 13;
    const lx = cx + lr * Math.cos(mid);
    const ly = cy + lr * Math.sin(mid);
    ctx.font = `${size < 200 ? 8 : 10}px Arial`;
    ctx.fillStyle = '#aaa';
    ctx.fillText(i + 'xx', lx, ly);
  });

  // Центральный круг
  ctx.beginPath();
  ctx.arc(cx, cy, r - 2, 0, 2 * Math.PI);
  ctx.fillStyle = '#16213e';
  ctx.fill();
}

const grid = document.getElementById('grid');

Object.entries(DATA).forEach(([t, vals]) => {
  const thousand = parseInt(t);
  const parity = thousand / 1000 % 2 === 0 ? 'чётные' : 'нечётные';

  const card = document.createElement('div');
  card.className = 'card';

  card.innerHTML = `
    <div class="card-title">${t}–${thousand + 999}</div>
    <div class="card-sub">${parity} тысячи</div>
  `;

  const canvas = document.createElement('canvas');
  card.appendChild(canvas);
  drawWheel(canvas, vals, 220);

  // Легенда совпадений
  const groups = findGroups(vals);
  if (groups.length > 0) {
    const legend = document.createElement('div');
    legend.className = 'legend';
    groups.sort((a, b) => b.val - a.val).forEach(g => {
      const item = document.createElement('div');
      item.className = 'legend-item';
      const dot = document.createElement('div');
      dot.className = 'legend-dot';
      dot.style.background = valueColor(g.val, vals);
      dot.style.border = '1.5px solid rgba(255,255,255,0.7)';
      item.appendChild(dot);
      item.appendChild(document.createTextNode(
        `${g.indices.map(i => i + 'xx').join(' = ')} = ${g.val}`
      ));
      legend.appendChild(item);
    });
    card.appendChild(legend);
  }

  grid.appendChild(card);
});
</script>
</body>
</html>
