<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Простые числа — диаграммы</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #f5f5f0;
    color: #222;
    font-family: 'Arial', sans-serif;
    padding: 30px 20px;
  }
  h1 {
    text-align: center;
    font-size: 2em;
    margin-bottom: 6px;
    color: #111;
  }
  .subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 10px;
    font-size: 0.9em;
  }
  .legend-global {
    display: flex;
    justify-content: center;
    gap: 28px;
    margin-bottom: 36px;
    flex-wrap: wrap;
  }
  .leg {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.95em;
    font-weight: bold;
  }
  .leg-box {
    width: 22px; height: 22px;
    border-radius: 5px;
    border: 2px solid rgba(0,0,0,0.15);
  }
  .grid {
    display: flex;
    flex-wrap: wrap;
    gap: 28px;
    justify-content: center;
  }
  .card {
    background: #fff;
    border-radius: 18px;
    padding: 18px 16px 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-shadow: 0 2px 12px rgba(0,0,0,0.1);
  }
  .card-title {
    font-size: 1.05em;
    font-weight: bold;
    margin-bottom: 2px;
    color: #111;
  }
  .card-sub {
    font-size: 0.72em;
    color: #999;
    margin-bottom: 12px;
  }
  canvas { display: block; }
  .counts {
    margin-top: 12px;
    display: flex;
    gap: 10px;
    font-size: 0.72em;
    color: #555;
  }
  .count-item {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .count-dot {
    width: 10px; height: 10px;
    border-radius: 3px;
    flex-shrink: 0;
  }
</style>
</head>
<body>

<h1>Простые числа</h1>
<p class="subtitle">Разница между последним и первым простым числом в каждой сотне</p>

<div class="legend-global">
  <div class="leg">
    <div class="leg-box" style="background:#4caf50"></div>
    <span>● кратное 6 — первое и последнее простое одного типа (6k±1)</span>
  </div>
  <div class="leg">
    <div class="leg-box" style="background:#ff9800"></div>
    <span>◑ остаток 2 — разные типы (−1→+1)</span>
  </div>
  <div class="leg">
    <div class="leg-box" style="background:#f44336"></div>
    <span>○ остаток 4 — разные типы (+1→−1)</span>
  </div>
  <div class="leg">
    <div class="leg-box" style="background:#9e9e9e"></div>
    <span>0xx — особый случай (начинается с числа 2)</span>
  </div>
</div>

<div class="grid" id="grid"></div>

<script>
const DATA = {"0": [95, 98, 82, 90, 98, 96, 90, 96, 78, 90], "1000": [88, 90, 96, 98, 90, 86, 98, 80, 88, 98], "2000": [96, 68, 94, 90, 66, 90, 90, 90, 96, 96], "3000": [88, 82, 96, 90, 92, 82, 90, 96, 86, 82], "4000": [98, 66, 96, 70, 84, 90, 88, 96, 88, 96], "5000": [96, 96, 88, 96, 76, 90, 70, 90, 96, 84], "6000": [84, 98, 96, 96, 70, 78, 84, 92, 96, 90], "7000": [78, 90, 90, 86, 88, 84, 96, 90, 66, 92], "8000": [84, 90, 88, 78, 48, 98, 90, 76, 90, 76], "9000": [90, 96, 90, 86, 94, 76, 96, 72, 84, 72]};

// 3 цвета по mod 6
const COLORS = {
  0: '#4caf50',  // зелёный — кратное 6
  2: '#ff9800',  // оранжевый — mod 2
  4: '#f44336',  // красный — mod 4
  special: '#9e9e9e' // серый — 0xx
};

function sectorColor(val, isSpecial) {
  if (isSpecial) return COLORS.special;
  return COLORS[val % 6] || '#aaa';
}

function drawWheel(canvas, vals, size) {
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  canvas.width = size * dpr;
  canvas.height = size * dpr;
  canvas.style.width = size + 'px';
  canvas.style.height = size + 'px';
  ctx.scale(dpr, dpr);

  const cx = size / 2, cy = size / 2;
  const R = size / 2 - 18;
  const r = R * 0.36;
  const n = vals.length;
  const gap = 0.04;
  const step = (2 * Math.PI) / n;
  const startAngle = -Math.PI / 2;

  vals.forEach((val, i) => {
    const isSpecial = (i === 0);
    const a1 = startAngle + i * step + gap / 2;
    const a2 = startAngle + (i + 1) * step - gap / 2;
    const mid = (a1 + a2) / 2;

    // Сектор
    ctx.beginPath();
    ctx.moveTo(cx + r * Math.cos(a1), cy + r * Math.sin(a1));
    ctx.arc(cx, cy, R, a1, a2);
    ctx.arc(cx, cy, r, a2, a1, true);
    ctx.closePath();

    const color = sectorColor(val, isSpecial);
    ctx.fillStyle = color;
    ctx.fill();

    // Тонкая тёмная обводка
    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Значение внутри сектора
    const tr = (R + r) / 2;
    const tx = cx + tr * Math.cos(mid);
    const ty = cy + tr * Math.sin(mid);

    ctx.font = `bold ${Math.round(size * 0.058)}px Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    // Тень для читаемости
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillText(val, tx + 1, ty + 1);
    ctx.fillStyle = '#fff';
    ctx.fillText(val, tx, ty);

    // Метка сотни снаружи
    const lr = R + 12;
    const lx = cx + lr * Math.cos(mid);
    const ly = cy + lr * Math.sin(mid);
    ctx.font = `${Math.round(size * 0.038)}px Arial`;
    ctx.fillStyle = '#555';
    ctx.fillText(i + 'xx', lx, ly);
  });

  // Центр
  ctx.beginPath();
  ctx.arc(cx, cy, r - 3, 0, 2 * Math.PI);
  ctx.fillStyle = '#fff';
  ctx.fill();
}

const grid = document.getElementById('grid');

Object.entries(DATA).forEach(([t, vals]) => {
  const thousand = parseInt(t);
  const parity = thousand / 1000 % 2 === 0 ? 'чётные тысячи' : 'нечётные тысячи';

  const card = document.createElement('div');
  card.className = 'card';

  card.innerHTML = `
    <div class="card-title">${t}–${thousand + 999}</div>
    <div class="card-sub">${parity}</div>
  `;

  const canvas = document.createElement('canvas');
  card.appendChild(canvas);
  drawWheel(canvas, vals, 230);

  // Счётчики типов
  const c0 = vals.slice(1).filter(v => v % 6 === 0).length;
  const c2 = vals.slice(1).filter(v => v % 6 === 2).length;
  const c4 = vals.slice(1).filter(v => v % 6 === 4).length;

  const counts = document.createElement('div');
  counts.className = 'counts';
  counts.innerHTML = `
    <div class="count-item"><div class="count-dot" style="background:#4caf50"></div>×${c0}</div>
    <div class="count-item"><div class="count-dot" style="background:#ff9800"></div>×${c2}</div>
    <div class="count-item"><div class="count-dot" style="background:#f44336"></div>×${c4}</div>
  `;
  card.appendChild(counts);

  grid.appendChild(card);
});
</script>
</body>
</html>
