const W = window.innerWidth;
const H = window.innerHeight;

renderer.setSize(W, H);
renderer.shadowMap.enabled = true;

document.body.appendChild(renderer.domElement);

window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
});

scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 20, 60);

// --- Camera ---
const camera = new THREE.PerspectiveCamera(70, W / H, 0.1, 200);
camera.position.set(0, 4, 10);
camera.lookAt(0, 1, 0);

scene.add(ambient);

const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(10, 20, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far = 100;
sun.shadow.camera.left = -30;
sun.shadow.camera.right = 30;
sun.shadow.camera.top = 30;
sun.shadow.camera.bottom = -30;
scene.add(sun);

// ============================================================

function makeMaterial(color, rough = 0.9, metal = 0) {
  return new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: metal });
}

const WALL_H = 6.125;
const walls          = [];
const steps          = [];
const supportSurfaces = [];
const WC = 0xa08060; // цвет стен
const raycaster = new THREE.Raycaster();
let floor = null;
let waterPondA = null;
let waterPondB = null;
let lavaPond = null;
let hiddenGladeFloor = null;
let sceneDecor = [];
let secretShipGroup = null;
let shipExplosion = false;
let shipExplosionProgress = 0;
let gameEnded = false;
let specialSignPos = null;
let diveSequence = false;
let diveProgress = 0;

function makeWall(x, z, w, h, d, color = WC) {
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    makeMaterial(color)
  );
  m.position.set(x, h / 2, z);
  m.castShadow = true;
  m.receiveShadow = true;
  scene.add(m);
  walls.push(m);
  return m;
}

// ============================================================
// ПАСХАЛКА #1 — ПЕТЛЯ СО СТРЕЛКАМИ
//
// Теперь это не набор отдельных стен, а цельное "кольцо":
// внешний прямоугольник + внутренний блок.
// Так коридор получается ровный и без случайных дыр.
// ============================================================

function makePath(x, z, w, d, color = 0x7b8f5f) {
  const path = new THREE.Mesh(
    new THREE.BoxGeometry(w, 0.1, d),
    makeMaterial(color, 1)
  );
  path.position.set(x, 0.05, z);
  path.receiveShadow = true;
  scene.add(path);
  supportSurfaces.push(path);
  sceneDecor.push(path);
  return path;
}

function makeStep(x, z, w, d, h = 0.5, color = 0x6f7385) {
  const step = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    makeMaterial(color)
  );
  step.position.set(x, h / 2, z);
  step.castShadow = true;
  step.receiveShadow = true;
  step.userData = { stepHeight: h };
  scene.add(step);
  steps.push(step);
  supportSurfaces.push(step);
  return step;
}

function makeSign(x, y, z, rotY, text) {
  const c = document.createElement('canvas');
  c.width = 512;
  c.height = 256;
  const ctx = c.getContext('2d');

  ctx.fillStyle = 'rgba(250,250,250,0.95)';
  ctx.strokeStyle = '#847045';
  ctx.lineWidth = 12;
  ctx.beginPath();
  ctx.moveTo(28, 28);
  ctx.lineTo(484, 28);
  ctx.quadraticCurveTo(504, 28, 504, 48);
  ctx.lineTo(504, 208);
  ctx.quadraticCurveTo(504, 228, 484, 228);
  ctx.lineTo(28, 228);
  ctx.quadraticCurveTo(8, 228, 8, 208);
  ctx.lineTo(8, 48);
  ctx.quadraticCurveTo(8, 28, 28, 28);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = '#2b2b2b';
  ctx.font = 'bold 52px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 256, 128);

  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();

  const backing = new THREE.Mesh(
    new THREE.PlaneGeometry(3.2, 1.3),
    new THREE.MeshBasicMaterial({ color: 0xfff5d6, transparent: true, opacity: 0.98, side: THREE.DoubleSide })
  );
  backing.position.set(x, y, z);
  backing.rotation.y = rotY;

  const front = new THREE.Mesh(
    new THREE.PlaneGeometry(3, 1.2),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide })
  );
  front.position.set(x, y + 0.01, z);
  front.rotation.y = rotY;

  const group = new THREE.Group();
  group.add(backing);
  group.add(front);
  scene.add(group);
  sceneDecor.push(group);
  return group;
}

function makeTree(x, z, crownColor = 0x5d8f3a) {
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.28, 0.34, 2.4, 10),
    makeMaterial(0x6b4423)
  );
  trunk.position.set(x, 1.2, z);
  trunk.castShadow = true;
  trunk.receiveShadow = true;
  scene.add(trunk);

  const crown = new THREE.Mesh(
    new THREE.SphereGeometry(1.5, 14, 14),
    makeMaterial(crownColor)
  );
  crown.position.set(x, 3.1, z);
  crown.castShadow = true;
  crown.receiveShadow = true;
  scene.add(crown);
}

function makePond(x, z, radius, color) {
  const pond = new THREE.Mesh(
    new THREE.CircleGeometry(radius, 36),
    makeMaterial(color, 0.2)
  );
  pond.rotation.x = -Math.PI / 2;
  pond.position.set(x, 0.12, z);
  pond.receiveShadow = true;
  scene.add(pond);
  return { x, z, radius };
}

function makeLunarRock(x, z, size, color = 0x5f667e) {
  const rock = new THREE.Mesh(
    new THREE.SphereGeometry(size, 16, 16),
    makeMaterial(color, 0.7)
  );
  rock.position.set(x, size * 0.4, z);
  rock.castShadow = true;
  rock.receiveShadow = true;
  scene.add(rock);
  sceneDecor.push(rock);
  walls.push(rock);
  supportSurfaces.push(rock);
  return rock;
}

function createConfetti() {
  const colors = ['#ff3864', '#ffd60a', '#4ade80', '#38bdf8', '#a78bfa'];
  const confettiParent = document.createElement('div');
  confettiParent.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:999;overflow:hidden;';
  document.body.appendChild(confettiParent);

  for (let i = 0; i < 60; i++) {
    const piece = document.createElement('div');
    const size = Math.random() * 8 + 6;
    piece.style.cssText = `position:absolute; width:${size}px; height:${size}px; background:${colors[Math.floor(Math.random() * colors.length)]}; opacity:${Math.random() * 0.6 + 0.4}; transform:rotate(${Math.random() * 360}deg); left:${Math.random() * 100}vw; top:-${size}px; border-radius:2px;`; 
    confettiParent.appendChild(piece);
    const speed = Math.random() * 180 + 120;
    const drift = Math.random() * 120 - 60;
    const rotSpeed = Math.random() * 360;
    let y = -size;
    const x0 = parseFloat(piece.style.left);
    function animate() {
      y += speed * 0.016;
      piece.style.top = `${y}px`;
      piece.style.left = `${x0 + drift * (y / window.innerHeight)}px`;
      piece.style.transform = `rotate(${rotSpeed * (y / window.innerHeight)}deg)`;
      if (y < window.innerHeight + size) {
        requestAnimationFrame(animate);
      } else {
        piece.remove();
      }
    }
    animate();
  }
  return confettiParent;
}

function showEndScreen() {
  if (gameEnded) return;
  gameEnded = true;
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:1000;pointer-events:none;';
  const text = document.createElement('div');
  text.textContent = 'КОНЕЦ';
  text.style.cssText = 'color:#fff;font-size:96px;font-weight:900;text-transform:uppercase;letter-spacing:0.2em;text-align:center;text-shadow:0 0 28px rgba(255,255,255,0.25);';
  overlay.appendChild(text);
  document.body.appendChild(overlay);
  createConfetti();
}

// ============================================================
// СТРЕЛОЧНЫЕ ЗНАКИ
// ============================================================

function makeWallArrow(x, y, z, rotY, arrow, label = '') {
  const c = document.createElement('canvas');
  c.width = 512;
  c.height = 512;
  const ctx = c.getContext('2d');

  ctx.clearRect(0, 0, 512, 512);
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'center';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(0,0,0,0.7)';
  ctx.lineWidth = 18;
  ctx.fillStyle = '#fff8dc';
  ctx.font = arrow.length > 1 ? 'bold 116px sans-serif' : 'bold 320px sans-serif';
  ctx.strokeText(arrow, 256, 210);
  ctx.fillText(arrow, 256, 210);

  if (label) {
    ctx.font = 'bold 56px sans-serif';
    ctx.strokeText(label, 256, 404);
    ctx.fillText(label, 256, 404);
  }

  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();

  const face = new THREE.Mesh(
    new THREE.PlaneGeometry(2.4, 2.4),
    new THREE.MeshBasicMaterial({
      map: tex,
      side: THREE.DoubleSide,
      transparent: true,
      polygonOffset: true,
      polygonOffsetFactor: -1,
      polygonOffsetUnits: -1,
    })
  );
  face.position.set(x, y, z);
  face.rotation.y = rotY;

  const group = new THREE.Group();
  group.add(face);
  scene.add(group);
  sceneDecor.push(group);
  return group;
}

// rotY=0       -> знак смотрит на юг (+z), игрок видит его снизу экрана и идёт на север
// rotY=Math.PI -> знак смотрит на север (-z)
// rotY=Math.PI/2  -> знак смотрит на запад (-x)
// rotY=-Math.PI/2 -> знак смотрит на восток (+x)

// Стрелки создаются только внутри buildLevel1() — здесь ничего не нужно.

playerGroup.position.set(0, 0, 0);

// Body

const gardenRespawn = new THREE.Vector3(-35.5, 0, -14);
const lavaExit = new THREE.Vector3(-56, 0, -22.5);

function addSecretShip() {
  if (state.level !== 3) return; // Только на третьем уровне
  if (secretShipGroup) return;
  
  const ship = new THREE.Group();
  
  // Корпус в виде луны (сфера с текстурой кратеров)
  const c = document.createElement('canvas');
  c.width = 512;
  c.height = 512;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#cccccc'; // Серый фон луны
  ctx.fillRect(0, 0, 512, 512);
  ctx.fillStyle = '#000000'; // Кратеры
  for (let i = 0; i < 20; i++) {
    const x = Math.random() * 512;
    const y = Math.random() * 512;
    const r = Math.random() * 30 + 10;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  
  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  
  const body = new THREE.Mesh(
    new THREE.SphereGeometry(1.5, 16, 16),
    new THREE.MeshStandardMaterial({ map: tex })
  );
  ship.add(body);
  
  // Текст "РАЗРАБОТЧИК" на луне
  const textCanvas = document.createElement('canvas');
  textCanvas.width = 512;
  textCanvas.height = 256;
  const textCtx = textCanvas.getContext('2d');
  textCtx.clearRect(0, 0, 512, 256);
  textCtx.fillStyle = '#ffffff';
  textCtx.font = 'bold 60px sans-serif';
  textCtx.textAlign = 'center';
  textCtx.fillText('РАЗРАБОТЧИК', 256, 150);
  
  const textTex = new THREE.CanvasTexture(textCanvas);
  textTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  
  const textPlane = new THREE.Mesh(
    new THREE.PlaneGeometry(2, 0.5),
    new THREE.MeshBasicMaterial({ map: textTex, transparent: true, side: THREE.DoubleSide })
  );
  textPlane.position.set(0, 0, 1.6); // На поверхности луны
  ship.add(textPlane);
  
  ship.position.set(0, 3.5, 0);
  ship.rotation.y = Math.PI / 4;
  scene.add(ship);
  secretShipGroup = ship;
}

function triggerShipExplosion() {
  if (!secretShipGroup || shipExplosion) return;
  shipExplosion = true;
  shipExplosionProgress = 0;
}

// Колонна с 4 знаками. specialDir = 'N'|'S'|'E'|'W' — та сторона получает (-)
function makeColumn(cx, cz, specialDir = null) {
  const pillar = new THREE.Mesh(
    new THREE.CylinderGeometry(0.42, 0.5, 5.2, 12),
    makeMaterial(0x8a7f72)
  );
  pillar.position.set(cx, 2.6, cz);
  pillar.castShadow = true;
  pillar.receiveShadow = true;
  scene.add(pillar);
  walls.push(pillar);
  sceneDecor.push(pillar);

  const cap = new THREE.Mesh(
    new THREE.CylinderGeometry(0.62, 0.42, 0.28, 12),
    makeMaterial(0x706860)
  );
  cap.position.set(cx, 5.34, cz);
  cap.castShadow = true;
  scene.add(cap);
  sceneDecor.push(cap);

  const base = new THREE.Mesh(
    new THREE.CylinderGeometry(0.62, 0.62, 0.24, 12),
    makeMaterial(0x706860)
  );
  base.position.set(cx, 0.12, cz);
  scene.add(base);
  sceneDecor.push(base);

  const r = 0.72;
  const signY = 2.6;
  const sides = [
    { dir: 'N', dx: 0,   dz: -r, rotY: Math.PI       },
    { dir: 'S', dx: 0,   dz:  r, rotY: 0              },
    { dir: 'E', dx:  r,  dz: 0,  rotY: Math.PI / 2    },
    { dir: 'W', dx: -r,  dz: 0,  rotY: -Math.PI / 2   },
  ];

  sides.forEach(s => {
    const isSpecial = s.dir === specialDir;
    const label = isSpecial ? '−' : '+';
    makeSign(cx + s.dx, signY, cz + s.dz, s.rotY, label);
    if (isSpecial) {
      specialSignPos = new THREE.Vector3(cx + s.dx, signY, cz + s.dz);
    }
  });
}

function buildWorld() {
  if      (state.level === 1)  { buildLevel1(); }
  else if (state.level === 2)  { buildLevel2(); }
  else if (state.level === 3)  { buildLevel3(); }

function rebuildWorld() {
  walls.forEach(w => scene.remove(w));
  walls.length = 0;
  steps.forEach(s => scene.remove(s));
  steps.length = 0;
  supportSurfaces.length = 0;
  if (floor) scene.remove(floor);
  if (waterPondA) { scene.remove(waterPondA); waterPondA = null; }
  if (waterPondB) { scene.remove(waterPondB); waterPondB = null; }
  if (lavaPond) { scene.remove(lavaPond); lavaPond = null; }
  if (hiddenGladeFloor) { scene.remove(hiddenGladeFloor); hiddenGladeFloor = null; }
  sceneDecor.forEach(o => scene.remove(o));
  sceneDecor.length = 0;
  if (secretShipGroup) {
    scene.remove(secretShipGroup);
    secretShipGroup = null;
  }
  shipExplosion = false;
  shipExplosionProgress = 0;
  buildWorld();
}

function makeBookshelf(x, z, rotY) {
  // Каркас полки
  const frame = new THREE.Mesh(
    new THREE.BoxGeometry(3.6, 5.0, 0.3),
    makeMaterial(0x5c3d1e)
  );
  frame.position.set(x, 2.5, z);
  frame.rotation.y = rotY;
  frame.castShadow = true;
  frame.receiveShadow = true;
  scene.add(frame);
  walls.push(frame);
  sceneDecor.push(frame);

  // Книги — 3 полки по 5 книг
  const bookColors = [0x8b1a1a, 0x1a3a6b, 0x1a5c2a, 0x6b4e1a, 0x4a1a6b, 0x7a3a1a, 0x1a5a5a];
  const shelfOffsets = [0.6, 1.9, 3.2]; // высоты полок
  const isLocal = rotY === 0 || rotY === Math.PI;

  shelfOffsets.forEach(sh => {
    for (let i = 0; i < 5; i++) {
      const bw = 0.36 + Math.random() * 0.18;
      const bh = 0.55 + Math.random() * 0.25;
      const color = bookColors[Math.floor(Math.random() * bookColors.length)];
      const book = new THREE.Mesh(
        new THREE.BoxGeometry(bw, bh, 0.22),
        makeMaterial(color)
      );
      const spread = 1.4;
      const along = (i - 2) * 0.58;
      const bx = isLocal ? x + along : x;
      const bz = isLocal ? z : z + along;
      book.position.set(bx, sh + bh / 2, bz);
      book.rotation.y = rotY;
      book.castShadow = true;
      scene.add(book);
      sceneDecor.push(book);
    }
  });
}

function insidePond(pos, pond) {
  if (!pond) return false;
  const dx = pos.x - pond.x;
  const dz = pos.z - pond.z;
  return dx * dx + dz * dz <= pond.radius * pond.radius;
}

function showMessage(text, duration = 3500) {
  const d = document.createElement('div');
  d.style.cssText = `
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    background:rgba(0,0,0,0.85); color:#fff; padding:20px 36px;
    border-radius:14px; font-size:22px; font-family:sans-serif;
    text-align:center; z-index:200; pointer-events:none;
    border:1px solid rgba(255,255,255,0.25); line-height:1.5;
  `;
  d.innerHTML = text;
  document.body.appendChild(d);
  setTimeout(() => d.remove(), duration);
}

// Keyboard
const keys = {};
const dot = document.getElementById('dot');

window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === 'Enter') {
    state.interact = true;
    dot.classList.add('pressed');
  }
  if (e.key === '1') { goToLevel(5); }
  
  // Проверка кода для пасхалки (кириллица)
  state.code.push(e.key.toLowerCase());
  if (state.code.length > 4) state.code.shift();
  if (state.code.join('') === 'лука') {
    if (!state.secretShip) {
      state.secretShip = true;

      showMessage('🚀 Секретный корабль разработчика открыт!');
    }
  }

  // ---- Расширенные пасхалки (текстовые коды) ----
  eggs.buf.push(e.key.toLowerCase());
  if (eggs.buf.length > 12) eggs.buf.shift();
  const buf = eggs.buf.join('');

  if (buf.endsWith('maze'))    eggFound('v1.0 — сделано с ❤️');                          // #6
  if (buf.endsWith('luka'))    eggFound('Привет, Лука 👋');                              // #7
  if (buf.endsWith('easter'))  eggFound('🥚 Найдено!');                                  // #8
  if (buf.endsWith('321'))   { eggFound('3... 2... 1... Пуск!'); state.jumpVel = 8; }   // #9
  if (buf.endsWith('hello') || buf.endsWith('привет')) eggFound('Привет, игрок 👾');     // #65
  if (buf.endsWith('why'))     eggFound('Потому что лабиринт');                          // #69
  if (buf.endsWith('version')) eggFound('Easter Maze v1.0 — Three.js r160');             // #68
  if (buf.endsWith('help') || buf.endsWith('aaa')) eggFound('Тебя никто не слышит 🙂'); // #70
  if (state.level === 12 && buf.endsWith('60')) eggFound('Астроном 🌌');                // #88
  if (buf.endsWith('debug')) {                                                            // #67
    eggs.debugOn = !eggs.debugOn;
    document.getElementById('egg-debug').style.display = eggs.debugOn ? 'block' : 'none';
    eggFound(eggs.debugOn ? '🔧 Debug ON' : '🔧 Debug OFF');
  }

  // Конами: ↑↑↓↓←→←→  (#10)
  const km = { ArrowUp:'u', ArrowDown:'d', ArrowLeft:'l', ArrowRight:'r' };
  if (km[e.key]) {
    eggs.konami.push(km[e.key]);
    if (eggs.konami.length > 8) eggs.konami.shift();
    if (eggs.konami.join('') === 'uuddlrlr') {
      eggFound('+30 жизней... но жизней нет 🎮');
      eggs.konami = [];
    }
  }

  // Зигзаг: L R L R L (#5) и Танец: L R L R (#49)
  if (e.key === 'ArrowLeft'  || e.key === 'a' || e.key === 'A') {
    if (eggs.zigzag[eggs.zigzag.length-1] !== 'L') eggs.zigzag.push('L');
  }
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
    if (eggs.zigzag[eggs.zigzag.length-1] !== 'R') eggs.zigzag.push('R');
  }
  if (eggs.zigzag.length > 10) eggs.zigzag.shift();
  const zz = eggs.zigzag.slice(-5).join('');
  if (zz === 'LRLRL') { eggFound('Змейка 🐍'); eggs.zigzag = []; }  // #5
  const dd = eggs.zigzag.slice(-4).join('');
  if (dd === 'LRLR')  { eggFound('💃 Диско'); eggs.zigzag = []; }    // #49

function isPointerOnShip(clientX, clientY) {
  if (!secretShipGroup) return false;
  const rect = renderer.domElement.getBoundingClientRect();
  const x = ((clientX - rect.left) / rect.width) * 2 - 1;
  const y = -((clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera({ x, y }, camera);
  const hits = raycaster.intersectObject(secretShipGroup, true);
  return hits.length > 0;
}

// Touch — swipe for rotation, buttons for move/jump
let touchStart = null;
let touchId = null;

renderer.domElement.addEventListener('touchstart', e => {
  const t = e.changedTouches[0];
  touchStart = { x: t.clientX, y: t.clientY };
  touchId = t.identifier;
}, { passive: true });

renderer.domElement.addEventListener('touchmove', e => {
  for (const t of e.changedTouches) {
    if (t.identifier === touchId && touchStart) {
      const dx = t.clientX - touchStart.x;
      state.yaw -= dx * 0.004;
      touchStart = { x: t.clientX, y: t.clientY };
    }
  }
}, { passive: true });

renderer.domElement.addEventListener('touchend', e => {
  for (const t of e.changedTouches) {
    if (t.identifier === touchId) {
      touchStart = null;
      touchId = null;
    }
  }
}, { passive: true });

// ============================================================
// COLLISION (AABB simple)
// ============================================================
const playerBox = new THREE.Box3();
const wallBox   = new THREE.Box3();
const stepBox   = new THREE.Box3();
const supportBox = new THREE.Box3();
const STEP_SNAP = 0.25;

function getSupportTop(obj) {
  const box = new THREE.Box3().setFromObject(obj);
  return box.max.y;
}

function resolveSupportOverlap(pos) {
  playerBox.setFromCenterAndSize(
    new THREE.Vector3(pos.x, pos.y + 0.9, pos.z),
    new THREE.Vector3(0.7, 1.8, 0.7)
  );
  for (const support of supportSurfaces) {
    supportBox.setFromObject(support);
    if (playerBox.intersectsBox(supportBox)) {
      const top = getSupportTop(support);
      // Только если падаем или стоим, и ноги игрока примерно у поверхности
      if (state.jumpVel <= 0 && pos.y <= top + STEP_SNAP) {
        pos.y = top;
        state.jumpVel = 0;
        state.onGround = true;
        return true;
      }
    }
  }
  return false;
}

function getStepTop(step) {
  return step.position.y + (step.userData.stepHeight || 0) / 2;
}

function resolveStepOverlap(pos) {
  playerBox.setFromCenterAndSize(
    new THREE.Vector3(pos.x, pos.y + 0.9, pos.z),
    new THREE.Vector3(0.7, 1.8, 0.7)
  );
  for (const step of steps) {
    stepBox.setFromObject(step);
    if (playerBox.intersectsBox(stepBox)) {
      const top = getStepTop(step);
      if (state.jumpVel <= 0 && pos.y <= top + STEP_SNAP) {
        pos.y = top;
        state.jumpVel = 0;
        state.onGround = true;
        return true;
      }
    }
  }
  return false;
}

function checkWallCollision(newPos) {
  playerBox.setFromCenterAndSize(
    new THREE.Vector3(newPos.x, newPos.y + 0.9, newPos.z),
    new THREE.Vector3(0.7, 1.8, 0.7)
  );
  for (const w of walls) {
    wallBox.setFromObject(w);
    if (playerBox.intersectsBox(wallBox)) return true;
  }
  return false;
}

function findStepCollision(newPos) {
  playerBox.setFromCenterAndSize(
    new THREE.Vector3(newPos.x, newPos.y + 0.9, newPos.z),
    new THREE.Vector3(0.7, 1.8, 0.7)
  );
  for (const step of steps) {
    stepBox.setFromObject(step);
    if (playerBox.intersectsBox(stepBox)) return step;
  }
  return null;
}

function findStepSupport(pos) {
  playerBox.setFromCenterAndSize(
    new THREE.Vector3(pos.x, pos.y + 0.9, pos.z),
    new THREE.Vector3(0.7, 1.8, 0.7)
  );
  for (const step of steps) {
    const top = getStepTop(step);
    if (pos.y > top + 0.7) continue;
    stepBox.setFromObject(step);
    if (playerBox.intersectsBox(stepBox) && pos.y <= top + 0.15) {
      return top;
    }
  }
  return null;
}

let last = performance.now();

// ============================================================
// EGG TICK — вызывается каждый кадр
// ============================================================
function eggTick(dt, pos) {
  eggs.levelTime += dt;

  // Одноразовая проверка времени суток (#34, #35, #36)
  if (!eggs.timeChecked) {
    eggs.timeChecked = true;
    const h = new Date().getHours();
    const d = new Date().getDay();
    if (h >= 23 || h < 1)    setTimeout(() => eggFound('Поздно. Ты должен спать.'), 3000);
    else if (h >= 1 && h < 7) setTimeout(() => eggFound('Рано встал! Или не ложился?'), 3000);
    if (d === 5)               setTimeout(() => eggFound('Пятница! Работать не надо 🎉'), 4000);
  }

  // #32 — скоростное прохождение (выход < 30 сек) — проверяется при goToLevel

  // #33 — 5 минут на уровне
  if (eggs.levelTime > 300 && !eggs._5min) {
    eggs._5min = true;
    eggFound('Ты здесь уже давно. Может, тебе здесь нравится?');
  }

  // #97 — край карты
  if ((Math.abs(pos.x) > 140 || Math.abs(pos.z) > 140) && !eggs._edge) {
    eggs._edge = true;
    eggFound('Край мира. Дальше — void.');
  }

  // #4 — стоять 30 секунд
  if (!eggs.lastPos) eggs.lastPos = pos.clone();
  const moved = pos.distanceTo(eggs.lastPos) > 0.15;
  if (moved) { eggs.lastPos.copy(pos); eggs.stillTime = 0; eggs._still30 = false; }
  else {
    eggs.stillTime += dt;
    if (eggs.stillTime > 30 && !eggs._still30) {
      eggs._still30 = true;
      eggFound('Ты не двигался 30 секунд. Всё в порядке?');
    }
  }

  // #1 — идти назад 10 секунд
  const goingBack = state.movingBack || keys['ArrowDown'] || keys['s'] || keys['S'];
  if (goingBack) {
    eggs.backwardTime += dt;
    if (eggs.backwardTime > 10 && !eggs._backward10) {
      eggs._backward10 = true; eggFound('Ты идёшь не туда. Или туда?');
    }
  } else { eggs.backwardTime = 0; eggs._backward10 = false; }

  // #3 — поворот 360°
  if (eggs.yawLast === null) eggs.yawLast = state.yaw;
  let dy = state.yaw - eggs.yawLast;
  while (dy > Math.PI) dy -= Math.PI * 2;
  while (dy < -Math.PI) dy += Math.PI * 2;
  eggs.yawAccum += Math.abs(dy);
  eggs.yawLast = state.yaw;
  if (eggs.yawAccum > Math.PI * 2 && !eggs._360done) {
    eggs._360done = true; eggFound('Земля всё ещё круглая 🌍');
  }
  if (eggs.yawAccum > Math.PI * 6) eggs.yawAccum = 0; // сброс

  // #71 — 100 шагов вперёд
  const goingFwd = state.moving || keys['ArrowUp'] || keys['w'] || keys['W'];
  if (goingFwd && moved) {
    eggs.forwardSteps++;
    if (eggs.forwardSteps >= 100 && !eggs.m100steps) {
      eggs.m100steps = true; eggFound('100 шагов. Марафон начинается с первого.');
    }
  }

  // #81 — Level 5: стоять у трона 5 секунд
  if (state.level === 5) {
    const thronePos = new THREE.Vector3(0, 0, 9);
    if (pos.distanceTo(thronePos) < 2.5) {
      eggs.throneTime += dt;
      if (eggs.throneTime > 5 && !eggs._throne) {
        eggs._throne = true; eggFound('Ты — король. Но лабиринт всё равно не пройден.');
      }
    } else { eggs.throneTime = 0; }
  }

  // #87 — Level 11: буквы E-a-s-t-e-r по порядку
  if (state.level === 11) {
    const lpos = [
      new THREE.Vector3(-7.5,2,-5), new THREE.Vector3(-7.5,2,-2),
      new THREE.Vector3(-7.5,2,1),  new THREE.Vector3(-7.5,2,4),
      new THREE.Vector3(-7.5,2,7),  new THREE.Vector3(-7.5,2,10),
    ];
    const ni = eggs.l11letters.length;
    if (ni < 6 && pos.distanceTo(lpos[ni]) < 2.5) {
      eggs.l11letters.push(ni);
      if (eggs.l11letters.length === 6) eggFound('E-A-S-T-E-R ✨', 7000);
    }
  }

  // #99, #100 — Level 12: смотреть на звезду / обойти её
  if (state.level === 12 && specialSignPos) {
    // #99 — гейз на звезду 5 сек
    const toStar = specialSignPos.clone().sub(pos).normalize();
    const fwd = new THREE.Vector3(-Math.sin(state.yaw), 0, -Math.cos(state.yaw));
    const dist = pos.distanceTo(specialSignPos);
    if (fwd.dot(toStar) > 0.92 && dist < 40) {
      eggs.l12gaze += dt;
      if (eggs.l12gaze > 5 && !eggs._l12gaze) {
        eggs._l12gaze = true; eggFound('Она тебя видит ⭐');
      }
    } else eggs.l12gaze = Math.max(0, eggs.l12gaze - dt);

    // #100 — обойти звезду 3 раза
    const angle = Math.atan2(pos.z - specialSignPos.z, pos.x - specialSignPos.x);
    if (eggs.l12starAngle !== null) {
      let delta = angle - eggs.l12starAngle;
      while (delta > Math.PI) delta -= Math.PI * 2;
      while (delta < -Math.PI) delta += Math.PI * 2;
      eggs.l12angleAccum += delta;
      if (Math.abs(eggs.l12angleAccum) >= Math.PI * 6 && !eggs._l12circle) {
        eggs._l12circle = true;
        eggFound('Звезда летит к тебе... ⭐');
        setTimeout(() => showEndScreen(), 3500);
      }
    }
    eggs.l12starAngle = angle;
  } else if (state.level !== 12) {
    eggs.l12starAngle = null; eggs.l12angleAccum = 0;
  }

  // Debug overlay
  if (eggs.debugOn) {
    const dbg = document.getElementById('egg-debug');
    if (dbg) dbg.textContent =
      `xyz: ${pos.x.toFixed(1)} ${pos.y.toFixed(1)} ${pos.z.toFixed(1)}` +
      ` | yaw: ${(state.yaw*180/Math.PI).toFixed(0)}°` +
      ` | lvl: ${state.level} | 🥚: ${eggs.found}`;
  }
}

function tick() {
  requestAnimationFrame(tick);

  const now = performance.now();
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;

  const pos = playerGroup.position;

  if (state.lavaSequence) {
    pos.y -= 8 * dt;
    playerGroup.rotation.y += 1.5 * dt;

    if (pos.y < -10) {
      state.lavaSequence = false;
      playerGroup.rotation.y = 0;
      respawnAt(new THREE.Vector3(0, 0, 0), Math.PI);
      showMessage('🔥 Следующий уровень');
      return; // следующий кадр уже с нормальной камерой
    }

    const camTarget = new THREE.Vector3(pos.x, pos.y + 1.0, pos.z);
    camera.position.set(pos.x + 2.6, pos.y + 4.2, pos.z + 2.6);
    camera.lookAt(camTarget);
    renderer.render(scene, camera);
    return;
  }

  if (diveSequence) {
    diveProgress += dt;
    pos.y -= 5 * dt;
    pos.z -= 2 * dt;
    playerGroup.rotation.x -= 1.2 * dt;

    const camTarget = new THREE.Vector3(pos.x, pos.y + 1.0, pos.z);
    camera.position.set(pos.x, pos.y + 3.5, pos.z + 5);
    camera.lookAt(camTarget);
    renderer.render(scene, camera);

    if (diveProgress > 2.2) {
      diveSequence = false;
      diveProgress = 0;
      playerGroup.rotation.x = 0;
      goToLevel(5);
    }
    return;
  }

  if (gameEnded) {
    renderer.render(scene, camera);
    return;
  }

  // --- Rotation from keyboard ---
  if (keys['ArrowLeft']  || keys['a'] || keys['A']) state.yaw += 2.0 * dt;
  if (keys['ArrowRight'] || keys['d'] || keys['D']) state.yaw -= 2.0 * dt;

  // --- Sprint ---
  const isSprinting = keys['Shift'];

  // --- Forward / Back movement ---
  const wantMove = state.moving
    || keys['ArrowUp'] || keys['w'] || keys['W'];
  const wantBack = state.movingBack
    || keys['ArrowDown'] || keys['s'] || keys['S'];

  // Unstuck: если игрок уже внутри стены — вытолкнуть
  if (checkWallCollision(pos)) {
    const nudge = 0.35;
    for (const t of [
      new THREE.Vector3(nudge, 0, 0), new THREE.Vector3(-nudge, 0, 0),
      new THREE.Vector3(0, 0, nudge), new THREE.Vector3(0, 0, -nudge),
    ]) {
      const attempt = pos.clone().add(t);
      if (!checkWallCollision(attempt)) { pos.copy(attempt); break; }
    }
  }

  if (wantMove || wantBack) {
    const currentSpeed = isSprinting && wantMove ? state.speed * 2.2 : state.speed;
    const dir = wantBack ? -1 : 1;
    const dx = Math.sin(state.yaw) * currentSpeed * dt * dir;
    const dz = Math.cos(state.yaw) * currentSpeed * dt * dir;
    const next = pos.clone().add(new THREE.Vector3(-dx, 0, -dz));
    const stepHit = findStepCollision(next);
    // Подъём на ступеньку только когда стоим или падаем, не во время прыжка вверх
    if (stepHit && state.jumpVel <= 0) {
      const stepTop = getStepTop(stepHit);
      const currentBottom = pos.y;
      if (stepTop - currentBottom <= 1.0) {
        next.y = stepTop;
        state.jumpVel = 0;
        state.onGround = true;
        pos.copy(next);
      }
    } else if (!stepHit && !checkWallCollision(next)) {
      pos.copy(next);
    } else if (stepHit && state.jumpVel > 0) {
      // Прыгаем — просто двигаемся горизонтально мимо ступеньки
      if (!checkWallCollision(next)) pos.copy(next);
    } else {
      // Скольжение вдоль стены: пробуем X и Z по отдельности
      const nextX = new THREE.Vector3(pos.x - dx, pos.y, pos.z);
      if (!checkWallCollision(nextX)) {
        pos.copy(nextX);
      } else {
        const nextZ = new THREE.Vector3(pos.x, pos.y, pos.z - dz);
        if (!checkWallCollision(nextZ)) pos.copy(nextZ);
      }
    }
  }

  // --- Jump ---
  if ((state.jumping || keys[' ']) && state.onGround) {
    state.jumpVel = JUMP_FORCE;
    state.onGround = false;
    eggs.totalJumps++;
    // #2 — 7 прыжков на месте
    if (!eggs.jumpInPlacePos) eggs.jumpInPlacePos = pos.clone();
    if (pos.distanceTo(eggs.jumpInPlacePos) < 1.0) {
      eggs.jumpInPlace++;
      if (eggs.jumpInPlace >= 7) { eggFound('×7'); eggs.jumpInPlace = 0; }
    } else {
      eggs.jumpInPlace = 0;
      eggs.jumpInPlacePos.copy(pos);
    }
    // #47 — 50 прыжков на уровне
    if (eggs.totalJumps >= 50 && !eggs.m50jumps) {
      eggs.m50jumps = true;
      eggFound('50 прыжков. Устал?');
    }
  }
  state.jumping = false;

  // --- Gravity ---
  state.jumpVel += GRAVITY * dt;
  pos.y += state.jumpVel * dt;
  if (pos.y <= 0) {
    pos.y = 0;
    state.jumpVel = 0;
    state.onGround = true;
  } else if (state.jumpVel < 0) {
    if (!resolveSupportOverlap(pos)) {
      resolveStepOverlap(pos);
    }
  }

  // --- Easter egg #1: прошёл сквозь призрачную стену ---
  if (pos.x < -20.5 && pos.z > -18.5 && pos.z < -13.5 && !state.foundEgg1) {
    state.foundEgg1 = true;
    showMessage('Ты прошёл сквозь стену!<br>🎉 Пасхалка найдена');
  }

  // --- Easter egg #2: сад с двумя водами и одной лавой ---
  if (insidePond(pos, waterPondA) || insidePond(pos, waterPondB)) {
    state.hp = Math.max(0, state.hp - 38 * dt);
    updateHpBar();
    if (state.hp <= 0.01) {
      state.hp = state.maxHp;
      updateHpBar();
      // Трекинг смертей
      eggs.totalDeaths++;
      const dp = pos.clone();
      if (eggs.lastDeathPos && dp.distanceTo(eggs.lastDeathPos) < 3) {
        eggs.sameDeaths++;
        if (eggs.sameDeaths >= 3) { eggFound('Это место тебя не любит'); eggs.sameDeaths = 0; } // #48
      } else { eggs.sameDeaths = 0; }
      eggs.lastDeathPos = dp;
      if (eggs.totalDeaths >= 10 && !eggs.m10deaths) { eggs.m10deaths = true; eggFound('10 смертей. Ты несмертелен — ну почти.'); } // #73
      respawnAt(gardenRespawn, Math.PI / 2);
      showMessage('Вода оказалась ловушкой.<br>Возрождение у входа в сад.');
    }
  }

  if (insidePond(pos, lavaPond) && !state.foundEgg2) {
    eggs.lavaDeaths++;
    if (eggs.lavaDeaths >= 3) { eggFound('Тебе нравится лава?'); eggs.lavaDeaths = 0; } // #95
    startLavaSequence();
  }

  // Нырок в башню на пляже (уровень 4)
  if (state.level === 4 && !diveSequence && !gameEnded && pos.z < -20 && pos.y <= 0.5) {
    diveSequence = true;
    diveProgress = 0;
    showMessage('Ты вошёл в воду...<br>🌊');
  }

  // Egg tick
  if (!gameEnded) eggTick(dt, pos);

  // Зонные переходы между уровнями
  if (state.level === 5 && pos.z < -21 && !gameEnded) {
    goToLevel(6);
  }
  if (state.level === 7 && pos.x > 13.5 && !gameEnded) {
    goToLevel(8);
  }
  if (state.level === 8 && pos.z < -17 && !gameEnded) {
    goToLevel(9);
  }
  if (state.level === 9 && pos.z < -17 && !gameEnded) {
    showMessage('🌊 Прыгаешь за борт...');
    goToLevel(10);
  }
  if (state.level === 10 && pos.z < -7 && !gameEnded) {
    showMessage('🔥 Портал затягивает...');
    goToLevel(11);
  }

  if (state.interact) {
    eggs.levelInteracts++;
    if (eggs.levelInteracts === 5) eggFound('Любопытный 🔍'); // #77
    if (state.level === 3) {
      if (!state.secretShip && specialSignPos && pos.distanceTo(specialSignPos) < 2.8) {
        state.secretShip = true;
        addSecretShip();
        showMessage('Знак сработал.<br>🚀 Корабль появился посреди сада!');
      } else if (secretShipGroup) {
        const shipPos = secretShipGroup.position;
        if (pos.distanceTo(shipPos) < 4.5) {
          triggerShipExplosion();
          showMessage('🚀 Корабль активирован!');
        }
      }
    } else if (state.level === 4) {
      if (specialSignPos && pos.distanceTo(specialSignPos) < 2.5 && !state.foundSecretBook) {
        state.foundSecretBook = true;
        showMessage(
          '📖 «Тот, кто дочитал до этой страницы,<br>уже прошёл лабиринт.»',
          6000
        );
      }
    } else if (state.level === 5) {
      // Тайная дверь за троном (#11)
      if (specialSignPos && pos.distanceTo(specialSignPos) < 2.5 && !state.foundCastle) {
        state.foundCastle = true;
        eggFound('👑 Тайный ход за троном открылся!', 6000);
      }
    } else if (state.level === 6) {
      if (specialSignPos && pos.distanceTo(specialSignPos) < 2.5) {
        showMessage('🔼 Лифт едет вверх...');
        goToLevel(7);
      }
    } else if (state.level === 8) {
      if (specialSignPos && pos.distanceTo(specialSignPos) < 2.5 && !state.foundSecretBook) {
        state.foundSecretBook = true;
        showMessage('📖 «Тот, кто дочитал до этой страницы,<br>уже прошёл лабиринт.»', 6000);
      }
    } else if (state.level === 10) {
      if (specialSignPos && pos.distanceTo(specialSignPos) < 2.5 && !state.foundPhone) {
        state.foundPhone = true;
        eggFound('📱 СМС: «Мы ждём тебя»', 5000);
      }
    } else if (state.level === 11) {
      if (specialSignPos && pos.distanceTo(specialSignPos) < 2.5) {
        showMessage('⚰️ Саркофаг открывается...');
        createConfetti();
        state.level = 12;
        state.secretShip = false;
        rebuildWorld();
        respawnAt(new THREE.Vector3(0, 2, 0), 0);
        showMessage('Уровень 12');
      }
    } else if (state.level === 12) {
      if (specialSignPos && pos.distanceTo(specialSignPos) < 3.0) {
        showEndScreen();
      }
    }
    state.interact = false;
  }

  if (shipExplosion) {
    shipExplosionProgress += dt;
    if (secretShipGroup) {
      secretShipGroup.rotation.x += 3.5 * dt;
      secretShipGroup.rotation.y += 4.7 * dt;
      const scale = 1 + shipExplosionProgress * 0.4;
      secretShipGroup.scale.set(scale, scale, scale);
    }
    if (shipExplosionProgress > 1.2) {
      shipExplosion = false;
      shipExplosionProgress = 0;
      createConfetti();
      showMessage('🎆 Переход на уровень 4!');
      state.level = 4;
      state.secretShip = false;
      rebuildWorld();
      respawnAt(new THREE.Vector3(0, 0, 12), 0); // смотрит на север — к воде
    }
  }

  // --- Player rotation ---
  playerGroup.rotation.y = state.yaw;

  // --- Camera follow (third person) с защитой от стен ---
  const CAM_DIST_MAX = 4.2;
  const CAM_HEIGHT = 3.2;
  const camTarget = new THREE.Vector3(pos.x, pos.y + 1.2, pos.z);

  // Желаемая позиция камеры
  const camDesired = new THREE.Vector3(
    pos.x + Math.sin(state.yaw) * CAM_DIST_MAX,
    pos.y + CAM_HEIGHT,
    pos.z + Math.cos(state.yaw) * CAM_DIST_MAX
  );

  // Raycast от игрока к желаемой позиции камеры
  const camOrigin = new THREE.Vector3(pos.x, pos.y + CAM_HEIGHT, pos.z);
  const camDir = camDesired.clone().sub(camOrigin).normalize();
  const camRay = new THREE.Raycaster(camOrigin, camDir, 0.1, CAM_DIST_MAX);
  const camHits = camRay.intersectObjects(walls);

  let camDist = CAM_DIST_MAX;
  if (camHits.length > 0) {
    camDist = Math.max(0.5, camHits[0].distance - 0.3);
  }

  camera.position.set(
    pos.x + Math.sin(state.yaw) * camDist,
    pos.y + CAM_HEIGHT,
    pos.z + Math.cos(state.yaw) * camDist
  );
  camera.lookAt(camTarget);

  renderer.render(scene, camera);
}

tick();
</script>
